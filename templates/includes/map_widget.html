{% load l10n %}
<div class="trail-map-shell">
  <div class="trail-map" data-map-canvas role="region" aria-label="{{ T.map_title }}" data-tiles="{{ MAP_TILE_URL }}" data-attribution="{{ MAP_TILE_ATTRIBUTION }}" data-trails-endpoint="{% url 'mountains:trails_api' %}" data-latitude="{{ latitude|default_if_none:''|unlocalize }}" data-longitude="{{ longitude|default_if_none:''|unlocalize }}" data-peak-name="{{ mountain_name|default:'' }}" data-peak-label="{{ T.map_peak }}" data-place-label="{{ T.weather_place }}" data-start-label="{{ T.map_start }}" data-finish-label="{{ T.map_finish }}" data-trail-segment-label="{{ T.map_trail_segment }}" data-loading-label="{{ T.map_loading }}" data-map-prompt="{{ T.map_prompt }}" data-empty-label="{{ T.map_none }}" data-error-label="{{ T.map_error }}" data-rate-label="{{ T.map_rate }}" data-library-error-label="{{ T.map_no_library }}"></div>
  <p class="trail-map-status" data-map-status role="status">{{ T.map_prompt }}</p>
  <ul class="mapped-trail-list" data-trail-list aria-label="{{ T.map_title }}"></ul>
  <p class="map-safety-note"><i data-lucide="info"></i>{{ T.map_safety_note }}</p>
</div>
