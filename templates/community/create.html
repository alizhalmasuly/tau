{% extends 'base.html' %}
{% block title %}{{ T.share_story }} — tau.{% endblock %}
{% block content %}<section class="simple-page-head"><div class="page-width"><p class="eyebrow">COMMUNITY — 01</p><h1>{{ T.story_create_title }}</h1><p>{{ T.stories_sub }}</p></div></section><section class="section form-page-section"><div class="page-width narrow-width"><form method="post" enctype="multipart/form-data" class="editor-form">{% csrf_token %}{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid-two"><label class="field-label">{{ T.story_title }}{{ form.title }}{{ form.title.errors }}</label><label class="field-label">{{ T.story_mountain }}{{ form.mountain }}{{ form.mountain.errors }}</label><label class="field-label">{{ T.story_date }}{{ form.hike_date }}{{ form.hike_date.errors }}</label><label class="field-label">{{ T.story_difficulty }}{{ form.difficulty }}{{ form.difficulty.errors }}</label></div><label class="field-label">{{ T.story_description }}{{ form.description }}{{ form.description.errors }}</label><label class="field-label">{{ T.tip }}{{ form.useful_tips }}{{ form.useful_tips.errors }}</label><label class="field-label">{{ T.story_equipment }}{{ form.equipment_used }}{{ form.equipment_used.errors }}</label><label class="field-label upload-field">{{ T.story_cover }}{{ form.cover }}{{ form.cover.errors }}</label><button class="button button-dark" type="submit">{{ T.publish_story }}<i data-lucide="arrow-up-right"></i></button></form></div></section>{% endblock %}
