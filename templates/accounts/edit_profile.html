{% extends 'base.html' %}
{% block title %}{{ T.edit_profile }} — UP!{% endblock %}
{% block content %}<section class="simple-page-head"><div class="page-width"><p class="eyebrow">TAU COMMUNITY</p><h1>{{ T.edit_profile }}</h1></div></section><section class="section form-page-section"><div class="page-width narrow-width"><form method="post" class="editor-form">{% csrf_token %}{% for field in form %}<label class="field-label">{% if field.name == 'bio' %}{{ T.profile_bio }}{% elif field.name == 'home_region' %}{{ T.profile_region }}{% else %}{{ T.profile_avatar }}{% endif %}{{ field }}{{ field.errors }}</label>{% endfor %}<button class="button button-dark" type="submit">{{ T.save_changes }}<i data-lucide="check"></i></button></form></div></section>{% endblock %}
